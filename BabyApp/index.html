<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁編碼、iPhone 視窗安全區與瀏覽器介面顏色。 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- 瀏覽器分頁與搜尋結果使用的頁面資訊。 -->
    <meta name="theme-color" content="#faf5ee" />
    <meta name="description" content="BabyApp：以 iPhone 使用體驗為核心的經期日曆與集點任務 PWA。" />
    <!-- iPhone 加到主畫面後以獨立 App 視窗開啟。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BabyApp" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>BabyApp</title>
  </head>
  <body>
    <!-- Vue 專案的根節點，src/main.js 會將 App 掛載於此。 -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
